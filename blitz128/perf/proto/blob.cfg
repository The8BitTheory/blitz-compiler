# Prototype blob: appended to a compiled C/ file at __BLOB__ (bank 0, behind the program); the SHARED part is copied
# to $FC00 at start-up and runs from the top 1 KB that the MMU shares between bank 0 and bank 1.
SYMBOLS { __BLOB__: type = weak, value = $5000; }
MEMORY {
    BLOB: start = __BLOB__, size = $FC00 - __BLOB__, file = %O;
    SH:   start = $FC00, size = $0300;
}
SEGMENTS {
    HOOK:   load = BLOB, type = rw;
    SHARED: load = BLOB, run = SH, type = rw, define = yes;
}
