# Improved 2026 runtime: extension block directly behind the original runtime image
# (image 1: $46B0, image 2: $6C41; set with -D __EXT__=...).  SHARED is copied to the common top page $FC00 by hook_init.
# SHADOW (18 bytes) = where the original runtime expects header 1/2 ($46B0/$6C41, absolute in init, init_vars, data_ptr_init,
# the CLR stub and the encrypted key patcher); hook_init copies the real header (behind the extension) there first.
SYMBOLS { __EXT__: type = weak, value = $46B0; }
MEMORY {
    EXT: start = __EXT__, size = $8000 - __EXT__, file = %O;
    SH:  start = $FC00, size = $0300;
}
SEGMENTS {
    SHADOW: load = EXT, type = rw, define = yes;
    EXT:    load = EXT, type = rw;
    SHARED: load = EXT, run = SH, type = rw, define = yes;
}
