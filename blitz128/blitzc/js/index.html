<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>blitzc – Blitz! 128 im Browser</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
  label { display: block; margin: .6rem 0 .2rem; font-weight: 600; }
  input[type=text] { width: 12rem; }
  button { margin-top: 1rem; padding: .4rem 1rem; }
  pre { background: #f4f4f4; padding: .8rem; overflow: auto; max-height: 20rem; }
  .files a { margin-right: 1rem; }
  small { color: #666; }
</style>
</head>
<body>
<h1>blitzc</h1>
<p>Nachbau des Blitz!&nbsp;128 Compilers (Skyles, V860929) in JavaScript. Alles läuft lokal im Browser.
Seite über einen lokalen Webserver öffnen (z.&nbsp;B. <code>npx serve js</code>), weil ES-Module per <code>file://</code> nicht laden.</p>

<label>BLITZ!.128 (Original-Compiler, liefert die Runtime)</label>
<input type="file" id="blitz">
<label>C128 BASIC-ROM hi, 318019-04 <small>(optional, für bitgenaue Gleitkommakonstanten)</small></label>
<input type="file" id="rom">
<label>Quellprogramm (getokentes BASIC-7-PRG)</label>
<input type="file" id="src">
<label>Programmname</label>
<input type="text" id="name" value="PROG">
<label>Schlüssel wie in Referenzdatei <small>(optional: C/-Datei des Originals, für byte-identische Ausgabe)</small></label>
<input type="file" id="like">
<br><button id="go">Kompilieren</button>
<p class="files" id="files"></p>
<pre id="screen"></pre>
<script type="module">
import { compile, keysOf } from './blitzc.js';
const $ = id => document.getElementById(id);
const read = async id => { const f = $(id).files[0]; return f ? new Uint8Array(await f.arrayBuffer()) : null; };
const link = (data, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data])); a.download = name; a.textContent = name; return a; };
$('go').onclick = async () => {
  const blitz = await read('blitz'), src = await read('src');
  if (!blitz || !src) { $('screen').textContent = 'BLITZ!.128 und Quellprogramm wählen.'; return; }
  const like = await read('like'); const basicRom = await read('rom');
  const name = $('name').value || 'PROG';
  try {
    const r = compile(src, blitz, { name, basicRom, ...(like ? keysOf(like) : {}) });
    $('files').replaceChildren(...[r.c && link(r.c, 'c-' + name.toLowerCase() + '.prg'), r.z && link(r.z, 'z-' + name.toLowerCase() + '.prg')].filter(Boolean));
    $('screen').textContent = r.screen;
  } catch (e) { $('screen').textContent = 'Fehler: ' + e.message; }
};
</script>
</body>
</html>
