<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blitzc – Blitz! 128 im Browser</title>
<style>
  :root { color-scheme: light dark; --fg:#222; --bg:#fff; --muted:#666; --box:#f4f4f4; --line:#d0d0d0; --accent:#2f6fdd; --ok:#2a9d4a; --err:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e4e4e4; --bg:#1b1b1d; --muted:#9a9a9a; --box:#262629; --line:#3d3d42; --accent:#5b9cff; --ok:#4cc16d; --err:#ff6b5b; } }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; color: var(--fg); background: var(--bg); }
  label { display: block; margin: .6rem 0 .2rem; font-weight: 600; }
  input[type=text] { width: 12rem; }
  button { margin-top: 1rem; padding: .4rem 1rem; }
  small { color: var(--muted); }
  .files a { margin-right: 1rem; }
  h2 { font-size: 1.05rem; margin: 1.6rem 0 .5rem; }
  /* progress per pass */
  .pass { display: grid; grid-template-columns: 4.2rem 1fr 6rem 7.5rem; gap: .6rem; align-items: center; margin: .35rem 0; }
  .pass b { font-variant-numeric: tabular-nums; }
  .bar { height: .9rem; background: var(--box); border: 1px solid var(--line); border-radius: .5rem; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
  .pass.done .bar > i { background: var(--ok); }
  .pass.idle { opacity: .55; }
  .pass input { width: 100%; box-sizing: border-box; font: inherit; font-family: ui-monospace, Consolas, monospace; text-align: right; }
  .pass .pct { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  #status { margin: .6rem 0 0; min-height: 1.4em; }
  #status.err { color: var(--err); }
  /* list of programs without runtime */
  #plain { list-style: none; margin: .3rem 0; padding: 0; }
  #plain li { display: flex; gap: .5rem; align-items: center; margin: .2rem 0; }
  #plain li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  #plain li button { margin: 0; padding: .1rem .6rem; }
  #plain:empty::before { content: 'no programs yet'; color: var(--muted); }
  .files div { margin: .2rem 0; }
  /* messages */
  #msgs { width: 100%; box-sizing: border-box; height: 15rem; resize: vertical; font: 13px/1.4 ui-monospace, Consolas, monospace; background: var(--box); color: var(--fg); border: 1px solid var(--line); border-radius: .3rem; padding: .5rem; white-space: pre; overflow: auto; }
</style>
</head>
<body>
<h1>blitzc</h1>
<p>Port of the Blitz!&nbsp;128 compiler (Skyles V860929, fixed build V261117) in JavaScript. Everything runs locally in the browser.<span id="srvhint">
Open this page through a local web server (e.g. <code>npx serve js</code>), because ES modules do not load from <code>file://</code>.</span></p>

<label>Program with runtime <small>(tokenized BASIC 7 PRG; may stay empty if the list below has a program)</small></label>
<input type="file" id="src">
<label>Program name</label>
<input type="text" id="name" value="PROG">
<label>Programs without runtime <small>(only run behind the program with runtime)</small></label>
<input type="file" id="add" multiple style="display:none">
<button type="button" id="addbtn" style="margin-top:.2rem">Add programs …</button>
<ul id="plain"></ul>
<label>Keys as in reference file <small>(optional: C/ file of the original, for byte-identical output; applies to all programs)</small></label>
<input type="file" id="like">
<label>Options <small>(apply to all programs)</small></label>
<label style="font-weight:normal"><input type="checkbox" id="runtime" checked> with runtime routines <small id="rthint">(off: C/ without runtime, needs a runtime that is already loaded)</small></label>
<label style="font-weight:normal"><input type="checkbox" id="full"> RESUME and COLLISION with full syntax <small>(off: no COLLISION, RESUME with line number only)</small></label>
<label style="font-weight:normal"><input type="checkbox" id="shared" checked disabled> Gemeinsame Variablentabelle <small id="sharedhint">(needs at least 2 programs)</small></label>
<br><button id="go">Compile</button>
<p id="status" aria-live="polite"></p>
<div class="files" id="files"></div>

<h2>Progress</h2>
<div id="passes"></div>

<h2>Messages <small id="msgcount"></small></h2>
<textarea id="msgs" readonly spellcheck="false" aria-label="Compiler messages"></textarea>

<script type="module">
const $ = id => document.getElementById(id);
const read = async id => { const f = $(id).files[0]; return f ? new Uint8Array(await f.arrayBuffer()) : null; };
const link = (data, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data])); a.download = name; a.textContent = name; return a; };

// ---- compile in a worker (live progress); falls back to the page itself if no worker can be started
const makeWorker = () => new Worker('./worker.js', { type: 'module' });
const runInline = async (job, post) => (await import('./blitzc.js')).compileJob(job, post);
function runJob(job, post) {
  return new Promise(resolve => {
    const inline = async () => { try { await runInline(job, post); } finally { resolve(); } };
    let w, got = false;
    try { w = makeWorker(); } catch { return inline(); }
    w.onmessage = ev => { got = true; post(ev.data); if (ev.data.type === 'done' || ev.data.type === 'error') { w.terminate(); resolve(); } };
    w.onerror = () => { w.terminate(); if (!got) inline(); else { post({ type: 'error', text: 'Worker crashed' }); resolve(); } };
    w.postMessage(job);
  });
}

// ---- one row per compiler pass: bar + last line number
const PASSES = [[0, 'PASS0', 'multi-program mode only'], [1, 'PASS1'], [2, 'PASS2']];
const rows = {};
for (const [n, label, idle] of PASSES) {
  const d = document.createElement('div'); d.className = 'pass idle';
  d.innerHTML = '<b></b><div class="bar"><i></i></div><span class="pct"></span><input type="text" readonly aria-label="letzte Zeilennummer">';
  d.querySelector('b').textContent = label;
  $('passes').append(d);
  if (idle) d.title = label + ': ' + idle;
  rows[n] = { d, bar: d.querySelector('i'), pct: d.querySelector('.pct'), line: d.querySelector('input'), idle: idle ? '–' : '' };
}
function resetRows(keepPass0 = false) {
  for (const [n, r] of Object.entries(rows)) {
    if (keepPass0 && n === '0') continue;     // overlay: PASS0 ran once for all programs, it stays "done"
    r.d.className = 'pass idle'; r.bar.style.width = '0'; r.pct.textContent = r.idle; r.line.value = ''; r.frac = 0;
  }
}
function finishRow(n) {
  const r = rows[n]; if (!r) return;
  r.d.className = 'pass done'; r.bar.style.width = '100%'; r.pct.textContent = '100 %';
  if (state[n]) r.line.value = state[n].line;
}

// ---- messages: appended, never overwritten; follows the end unless the reader scrolled up
let pend = [], total = 0, frame = 0, state = {};
function paint() {
  frame = 0;
  for (const [n, r] of Object.entries(rows)) {
    const s = state[n]; if (!s) continue;
    r.line.value = s.line;
    if (!r.d.classList.contains('done')) { r.bar.style.width = s.pct + '%'; r.pct.textContent = Math.round(s.pct) + ' %'; }
  }
  if (pend.length) {
    const ta = $('msgs'), atEnd = ta.scrollHeight - ta.scrollTop - ta.clientHeight < 24;
    ta.value += pend.join('\n') + '\n'; pend = [];
    if (atEnd) ta.scrollTop = ta.scrollHeight;
    $('msgcount').textContent = '(' + total + ')';
  }
}
const later = () => { if (!frame) frame = requestAnimationFrame(paint); };

function onMsg(m) {
  switch (m.type) {
    case 'pass':
      for (const n in rows) if (+n < m.pass && !rows[n].d.classList.contains('idle')) finishRow(n);
      rows[m.pass].d.className = 'pass'; rows[m.pass].pct.textContent = '0 %'; break;
    case 'progress': state[m.pass] = { line: m.line, pct: 100 * m.index / m.total }; later(); break;
    case 'message': pend.push(m.text); total++; later(); break;
    case 'error': pend.push('ERROR: ' + m.text); total++; later(); $('status').className = 'err'; $('status').textContent = 'Error: ' + m.text; break;
    case 'program': onProgram(m); break;
    case 'done': finish(m); break;
  }
}
let t0 = 0, curName = '', curRuntime = true, count = 1;
const base = f => f.name.replace(/\.[^.]*$/, '').toUpperCase().replace(/[^A-Z0-9 ._-]/g, '').slice(0, 14) || 'PROG';
const fname = (kind, name) => kind + '-' + name.toLowerCase() + '.prg';

// ---- list of programs without runtime: [{file, input}]
const plain = [];
function drawList() {
  $('plain').replaceChildren(...plain.map((p, i) => {
    const li = document.createElement('li'), n = document.createElement('input'), sp = document.createElement('span'), rm = document.createElement('button');
    n.type = 'text'; n.value = p.name; n.setAttribute('aria-label', 'Program name ' + p.file.name); n.oninput = () => { p.name = n.value; };
    sp.textContent = p.file.name; rm.type = 'button'; rm.textContent = 'Remove'; rm.onclick = () => { plain.splice(i, 1); drawList(); };
    li.append(n, sp, rm); return li;
  }));
  $('runtime').disabled = plain.length > 0;
  updateShared();
  $('rthint').textContent = plain.length ? '(the program with runtime always has it, the ones in the list never)' : '(off: C/ without runtime, needs a runtime that is already loaded)';
}
// "Gemeinsame Variablentabelle" = original compiler menu item 4 (overlay): all programs get ONE variable table, so variables survive LOAD
// between the modules. Only possible with at least two programs; the first one gets the runtime, the others start behind it.
function updateShared() {
  const n = ($('src').files.length ? 1 : 0) + plain.length, cb = $('shared');
  cb.disabled = n < 2;
  $('sharedhint').textContent = n < 2 ? '(needs at least 2 programs)'
    : cb.checked ? '(menu item 4 of the original: one variable table for all modules, output files named like the programs - chain them with LOAD "NAME",8)'
    : '(off: every program is compiled on its own, files C/NAME and Z/NAME)';
}
$('shared').onchange = updateShared;
$('addbtn').onclick = () => $('add').click();
$('add').onchange = () => { for (const f of $('add').files) plain.push({ file: f, name: base(f) }); $('add').value = ''; drawList(); };
$('src').onchange = () => { const f = $('src').files[0]; if (f) $('name').value = base(f); updateShared(); };

function onProgram(m) {
  curName = m.name; curRuntime = m.runtime; count = m.count;
  if (m.count > 1) { pend.push(`--- ${m.index + 1}/${m.count}: ${m.name} (${m.runtime ? 'with' : 'without'} runtime) ---`); total++; }
  if (frame) cancelAnimationFrame(frame); paint();
  state = {}; resetRows(m.overlay);
  if (m.overlay) { const r = rows[1]; r.d.className = 'pass'; r.pct.textContent = '0 %'; }
  $('status').className = ''; $('status').textContent = m.count > 1 ? `Compiling ${m.index + 1}/${m.count}: ${m.name} …` : 'Compiling …';
}
function finish(m) {
  if (frame) cancelAnimationFrame(frame); paint();
  for (const n in rows) if (!rows[n].d.classList.contains('idle')) finishRow(n);
  const sec = ((performance.now() - t0) / 1000).toFixed(2).replace('.', ',');
  const box = [];
  for (const r of m.results) {
    const d = document.createElement('div'), t = document.createElement('b');
    t.textContent = r.name + (r.runtime ? ' (with runtime)' : ' (without runtime)') + ': ';
    d.append(t);
    if (r.error) d.append(r.error);
    else for (const [k, data] of [['c', r.c], ['z', r.z]]) if (data) d.append(link(data, m.overlay ? r.name.toLowerCase() + '.prg' : fname(k, r.name)));
    if (r.errors) d.append(` (errors: ${r.errors})`);
    box.push(d);
  }
  if (m.d81) { const d = document.createElement('div'); d.append(link(m.d81, (m.results[0].name || 'blitzc').toLowerCase() + '.d81')); d.append(m.overlay ? ' (all modules under their program names, as the original writes them)' : ' (all files as C/ and Z/)'); box.push(d); }
  $('files').replaceChildren(...box);
  $('status').className = m.errors ? 'err' : '';
  $('status').textContent = `Done in ${sec} s – ${m.results.length} program${m.results.length > 1 ? 's' : ''}, errors: ${m.errors}, extensions: ${m.extensions}`;
}

$('go').onclick = async () => {
  const src = await read('src'), programs = [];
  if (src) programs.push({ src, name: $('name').value || 'PROG', runtime: plain.length ? true : $('runtime').checked });
  for (const p of plain) programs.push({ src: new Uint8Array(await p.file.arrayBuffer()), name: p.name, runtime: false });
  if (!programs.length) { $('status').className = 'err'; $('status').textContent = 'Choose a program with runtime or add programs to the list.'; return; }
  const job = { programs, blitz: null, like: await read('like'), fullSyntax: $('full').checked, overlay: programs.length > 1 && !$('shared').disabled && $('shared').checked };
  $('go').disabled = true; $('files').replaceChildren(); $('msgs').value = ''; $('msgcount').textContent = '';
  pend = []; total = 0; state = {}; resetRows(); $('status').className = ''; $('status').textContent = 'Compiling …'; t0 = performance.now();
  await runJob(job, onMsg);
  $('go').disabled = false;
};
drawList();
resetRows();
updateShared();
</script>
</body>
</html>
